      <text x="25" y="55" fill="#ffffff" font-size="20" font-weight="900">Odds Ratio: 3.0 to 3.9</text>

      <text x="20" y="85" fill="#ffffff" font-size="15" font-weight="800">Chronic Kidney Disease (CKD)</text>
      <text x="20" y="105" fill="#c084fc" font-size="11" font-weight="700">Selective Proximal Tubule Destruction</text>
      
      <text x="20" y="128" fill="#cbd5e1" font-size="11" font-weight="700">Biological Mechanism:</text>
      <text x="20" y="146" fill="#94a3b8" font-size="11">Lead nephrotoxicity selectively destroys</text>
      <text x="20" y="162" fill="#94a3b8" font-size="11">proximal convoluted tubules, inducing mitochondrial</text>
      <text x="20" y="178" fill="#94a3b8" font-size="11">swelling, interstitial fibrosis, and loss of eGFR.</text>
      <text x="20" y="194" fill="#94a3b8" font-size="11">Leaves patients defenseless against cytokine storms.</text>
      
      <text x="20" y="218" fill="#64748b" font-size="10" font-family="monospace">Citation: JASN / CDC ICU Co-morbidity Registries</text>
    </g>

    <!-- Comorbidity 3: Hypertension -->
    <g transform="translate(750, 15)">
      <rect width="350" height="235" rx="12" fill="url(#cardGradDark)" stroke="#f59e0b" stroke-width="1.2"/>
      <rect x="15" y="15" width="320" height="48" rx="8" fill="#451a03" stroke="#f59e0b" stroke-width="0.8"/>
