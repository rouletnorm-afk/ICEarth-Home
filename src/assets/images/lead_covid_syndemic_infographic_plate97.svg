  <!-- ================= ROW 2: THE 4 FATAL CLINICAL COMORBIDITIES ================= -->
  <g transform="translate(60, 390)">
    <text x="0" y="0" fill="#cbd5e1" font-size="13" font-weight="800" font-family="monospace" letter-spacing="1.5">SECTION II: THE 4 FATAL COMORBIDITY MULTIPLIERS (LEAD CAUSAL MECHANISMS)</text>

    <!-- Comorbidity 1: Cardiovascular Disease -->
    <g transform="translate(0, 15)">
