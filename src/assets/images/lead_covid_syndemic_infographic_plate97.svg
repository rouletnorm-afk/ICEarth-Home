      <text x="25" y="55" fill="#ffffff" font-size="20" font-weight="900">Odds Ratio: 2.0 to 3.2</text>

      <text x="20" y="85" fill="#ffffff" font-size="15" font-weight="800">Systemic Hypertension</text>
      <text x="20" y="105" fill="#fbbf24" font-size="11" font-weight="700">Loss of Arterial Elasticity &amp; RAAS Overdrive</text>
      
      <text x="20" y="128" fill="#cbd5e1" font-size="11" font-weight="700">Biological Mechanism:</text>
      <text x="20" y="146" fill="#94a3b8" font-size="11">Lead activates the renin-angiotensin-aldosterone</text>
      <text x="20" y="162" fill="#94a3b8" font-size="11">system (RAAS) and elevates sympathetic tone,</text>
      <text x="20" y="178" fill="#94a3b8" font-size="11">causing permanent vascular constriction. COVID</text>
      <text x="20" y="194" fill="#94a3b8" font-size="11">downregulates ACE2, driving sudden shock.</text>
      
      <text x="20" y="218" fill="#64748b" font-size="10" font-family="monospace">Citation: Hypertension / Navas-Acien et al.</text>
    </g>

    <!-- Comorbidity 4: Diabetes Mellitus -->
    <g transform="translate(1125, 15)">
