      <text x="25" y="55" fill="#ffffff" font-size="20" font-weight="900">Odds Ratio: 1.8 to 2.6</text>

      <text x="20" y="85" fill="#ffffff" font-size="15" font-weight="800">Diabetes Mellitus (T2D)</text>
      <text x="20" y="105" fill="#38bdf8" font-size="11" font-weight="700">Pancreatic Beta-Cell Disruption</text>
      
      <text x="20" y="128" fill="#cbd5e1" font-size="11" font-weight="700">Biological Mechanism:</text>
      <text x="20" y="146" fill="#94a3b8" font-size="11">Pb²⁺ blocks voltage-gated Ca²⁺ channels</text>
      <text x="20" y="162" fill="#94a3b8" font-size="11">in pancreatic islet cells, reducing insulin secretion</text>
      <text x="20" y="178" fill="#94a3b8" font-size="11">and inducing systemic receptor resistance.</text>
      <text x="20" y="194" fill="#94a3b8" font-size="11">Chronic hyperglycemia fuels viral replication.</text>
      
      <text x="20" y="218" fill="#64748b" font-size="10" font-family="monospace">Citation: Diabetes Care / Environmental Health</text>
