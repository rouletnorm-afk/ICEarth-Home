    <rect x="0" y="0" width="160" height="26" rx="6" fill="#dc2626"/>
    <text x="80" y="17" fill="#ffffff" font-size="12" font-weight="900" letter-spacing="1.5" text-anchor="middle" font-family="monospace">PLATE #97 • SCIENTIFIC</text>

    <!-- Category Tag -->
    <rect x="172" y="0" width="380" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="362" y="17" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle" font-family="monospace">EPIDEMIOLOGICAL EXPOSENOMICS SYNTHESIS</text>

    <!-- Provenance Vault Hash -->
    <rect x="1090" y="0" width="390" height="26" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
    <text x="1285" y="17" fill="#9ca3af" font-size="10" font-weight="600" text-anchor="middle" font-family="monospace">0xLEAD_COVID_SYNDEMIC_THE_REAL_PANDEMIC_PLATE_97</text>

    <!-- Main Title -->
    <text x="0" y="72" fill="#ffffff" font-size="34" font-weight="900" letter-spacing="-0.5">LEAD POISONING &amp; THE COVID-19 SYNDEMIC</text>
    <text x="0" y="100" fill="#f87171" font-size="17" font-weight="700">How Chronic Heavy Metal Burden Pre-Programmed Cardiovascular Collapse, Renal Failure &amp; Disproportionate Minority Mortality</text>
    <text x="0" y="122" fill="#94a3b8" font-size="13">Peer-Reviewed Grounding: CDC NHANES (1970–2020) • The Lancet Planetary Health • American Heart Association • APM Research Lab</text>
  </g>

  <!-- ================= ROW 1: THE MORTALITY SCALE & COMPARATIVE BASELINE ================= -->
  <g transform="translate(60, 185)">
    <!-- Section Title -->
    <text x="0" y="0" fill="#cbd5e1" font-size="13" font-weight="800" font-family="monospace" letter-spacing="1.5">SECTION I: COMPARATIVE GLOBAL MORTALITY SCALE</text>

    <!-- Card 1: Annual Lead Mortality -->
    <g transform="translate(0, 15)">
      <rect width="350" height="150" rx="12" fill="url(#cardGradDark)" stroke="#dc2626" stroke-width="1.5"/>
      <rect x="0" y="0" width="350" height="4" rx="2" fill="#dc2626"/>
      <text x="20" y="28" fill="#f87171" font-size="11" font-weight="800" font-family="monospace">HUMANITY'S BASELINE PANDEMIC</text>
      <text x="20" y="68" fill="#ffffff" font-size="36" font-weight="900">3.5M – 5.5M</text>
      <text x="20" y="90" fill="#ef4444" font-size="13" font-weight="700">Lead Deaths Per Year (Primarily CVD)</text>
      <text x="20" y="112" fill="#94a3b8" font-size="11">>25M Cumulative deaths since 2020</text>
      <text x="20" y="128" fill="#cbd5e1" font-size="11" font-weight="700">Quietly exceeds total confirmed COVID deaths</text>
    </g>

    <!-- Card 2: COVID-19 Deaths -->
    <g transform="translate(375, 15)">
      <rect width="350" height="150" rx="12" fill="url(#cardGradDark)" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="350" height="4" rx="2" fill="#f59e0b"/>
      <text x="20" y="28" fill="#fbbf24" font-size="11" font-weight="800" font-family="monospace">NOVEL CORONAVIRUS (2020–2026)</text>
      <text x="20" y="68" fill="#ffffff" font-size="36" font-weight="900">7.3M – 17.9M</text>
      <text x="20" y="90" fill="#f59e0b" font-size="13" font-weight="700">Reported Global COVID Deaths</text>
      <text x="20" y="112" fill="#94a3b8" font-size="11">~27M Global excess mortality</text>
      <text x="20" y="128" fill="#cbd5e1" font-size="11">Mortality concentrated in pre-damaged bodies</text>
    </g>

    <!-- Card 3: Global CVD Baseline -->
    <g transform="translate(750, 15)">
      <rect width="350" height="150" rx="12" fill="url(#cardGradDark)" stroke="#334155" stroke-width="1.2"/>
      <rect x="0" y="0" width="350" height="4" rx="2" fill="#06b6d4"/>
      <text x="20" y="28" fill="#38bdf8" font-size="11" font-weight="800" font-family="monospace">GLOBAL CARDIOVASCULAR BASELINE</text>
      <text x="20" y="68" fill="#ffffff" font-size="36" font-weight="900">19.2M – 20.5M</text>
      <text x="20" y="90" fill="#06b6d4" font-size="13" font-weight="700">Annual CVD Deaths Worldwide</text>
      <text x="20" y="112" fill="#94a3b8" font-size="11">Accounts for roughly 1/3 of all global deaths</text>
      <text x="20" y="128" fill="#cbd5e1" font-size="11">Lancet: Lead exposure directly explains 5.5M CVD deaths</text>
    </g>

    <!-- Card 4: US Heart Disease Baseline -->
