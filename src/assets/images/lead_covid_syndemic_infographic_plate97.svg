      <rect x="15" y="15" width="320" height="48" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="0.8"/>
      <text x="25" y="34" fill="#fca5a5" font-size="10" font-weight="800" font-family="monospace">COVID-19 MORTALITY MULTIPLIER</text>
      <text x="25" y="55" fill="#ffffff" font-size="20" font-weight="900">2.5× to 3.5× Higher Risk</text>

      <text x="20" y="85" fill="#ffffff" font-size="15" font-weight="800">Cardiovascular Disease (CVD)</text>
      <text x="20" y="105" fill="#f87171" font-size="11" font-weight="700">Lead Attributable Fraction: 77% of Lancet Cost</text>
      
      <text x="20" y="128" fill="#cbd5e1" font-size="11" font-weight="700">Biological Mechanism:</text>
      <text x="20" y="146" fill="#94a3b8" font-size="11">Pb²⁺ uncouples endothelial nitric oxide</text>
      <text x="20" y="162" fill="#94a3b8" font-size="11">synthase (eNOS), drives +340% ROS surge,</text>
      <text x="20" y="178" fill="#94a3b8" font-size="11">destroys vascular compliance, and accelerates</text>
      <text x="20" y="194" fill="#94a3b8" font-size="11">atheroma. Viral ACE2 attack triggers thrombosis.</text>
      
      <text x="20" y="218" fill="#64748b" font-size="10" font-family="monospace">Citation: AHA Circulation / Lancet Planet Health</text>
    </g>

    <!-- Comorbidity 2: Chronic Kidney Disease -->
    <g transform="translate(375, 15)">
      <rect width="350" height="235" rx="12" fill="url(#cardGradDark)" stroke="#a855f7" stroke-width="1.2"/>
      <rect x="15" y="15" width="320" height="48" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="0.8"/>
