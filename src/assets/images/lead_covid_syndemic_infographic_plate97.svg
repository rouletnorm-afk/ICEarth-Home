      <text x="20" y="68" fill="#ffffff" font-size="36" font-weight="900">~655,000+</text>
      <text x="20" y="90" fill="#10b981" font-size="13" font-weight="700">US Heart Disease Deaths / Year</text>
      <text x="20" y="112" fill="#94a3b8" font-size="11">AHA: Toxic metals establish primary etiology</text>
      <text x="20" y="128" fill="#cbd5e1" font-size="11">Vascular endothelia primed for viral collapse</text>
    </g>
