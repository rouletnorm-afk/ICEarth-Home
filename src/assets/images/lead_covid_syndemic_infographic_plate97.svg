      <rect x="0" y="0" width="460" height="4" rx="2" fill="#eab308"/>
      <text x="20" y="28" fill="#fde047" font-size="11" font-weight="800" font-family="monospace">APM RESEARCH LAB: THE COLOR OF CORONAVIRUS</text>
      <text x="20" y="54" fill="#ffffff" font-size="18" font-weight="900">The Youth Paradox Decoded</text>
      
      <rect x="20" y="65" width="420" height="44" rx="6" fill="#713f12" opacity="0.3"/>
      <text x="30" y="82" fill="#fef08a" font-size="10" font-style="italic">"Younger Black, Latino &amp; Indigenous Americans died at rates</text>
      <text x="30" y="98" fill="#fef08a" font-size="10" font-style="italic">far above white Americans despite their relative youthfulness."</text>

      <text x="20" y="130" fill="#cbd5e1" font-size="11" font-weight="700">The Driving Role of Historical Heavy Metal Burden:</text>
      <text x="20" y="150" fill="#94a3b8" font-size="11">• Redlining placed interstate highways &amp; leaded gasoline</text>
      <text x="20" y="166" fill="#94a3b8" font-size="11">  exhaust plumes (1921–1986) directly through minority neighborhoods.</text>
      <text x="20" y="182" fill="#94a3b8" font-size="11">• Pre-1978 lead paint and unreplaced lead water pipes aged vascular</text>
      <text x="20" y="198" fill="#94a3b8" font-size="11">  and renal systems by 25–30 years ahead of chronological age.</text>
      <text x="20" y="218" fill="#facc15" font-size="10" font-weight="700" font-family="monospace">Age-adjusted Mortality: Black (2.4×) • Indigenous (3.3×) • Latino (2.8×)</text>
    </g>

    <!-- Panel 2: Bone Lead Mobilization in Adults 65+ -->
    <g transform="translate(485, 15)">
      <rect width="490" height="235" rx="12" fill="url(#cardGradDark)" stroke="#f43f5e" stroke-width="1.2"/>
      <rect x="0" y="0" width="490" height="4" rx="2" fill="#f43f5e"/>
      <text x="20" y="28" fill="#fda4af" font-size="11" font-weight="800" font-family="monospace">SKELETAL HYDROXYAPATITE RESERVOIR</text>
      <text x="20" y="54" fill="#ffffff" font-size="18" font-weight="900">Bone Lead Mobilization in Adults 65+</text>
      
      <text x="20" y="80" fill="#cbd5e1" font-size="11" font-weight="700">90%–95% of Adult Lifetime Lead is Stored in the Skeleton:</text>
      <text x="20" y="100" fill="#94a3b8" font-size="11">• Pb²⁺ substitutes for Ca²⁺ in bone mineral: Ca₁₀(PO₄)₆(OH)₂ → Pb₁₀(PO₄)₆(OH)₂.</text>
      <text x="20" y="116" fill="#94a3b8" font-size="11">• Half-life in bone: 20 to 30 years (Howard Hu / Harvard KXRF Dosimetry).</text>
      
      <rect x="20" y="130" width="450" height="50" rx="6" fill="#881337" opacity="0.3"/>
      <text x="30" y="148" fill="#fecdd3" font-size="11" font-weight="700">The Acute Infection Trigger:</text>
      <text x="30" y="168" fill="#ffe4e6" font-size="10.5">COVID-19 fever and systemic acidosis activate osteoclasts, dumping</text>
      <text x="30" y="184" fill="#ffe4e6" font-size="10.5">decades of sequestered lead into blood, inducing multiorgan failure.</text>

      <text x="20" y="218" fill="#fb7185" font-size="10" font-weight="700" font-family="monospace">Explains why the 1940–1975 peak TEL cohort bore >80% of ICU mortality</text>
    </g>

    <!-- Panel 3: Macroeconomic Synthesis -->
    <g transform="translate(1000, 15)">
      <rect width="480" height="235" rx="12" fill="url(#cardGradDark)" stroke="#10b981" stroke-width="1.2"/>
      <rect x="0" y="0" width="480" height="4" rx="2" fill="#10b981"/>
      <text x="20" y="28" fill="#6ee7b7" font-size="11" font-weight="800" font-family="monospace">MACROECONOMIC BURDEN COMPARISON</text>
      <text x="20" y="54" fill="#ffffff" font-size="18" font-weight="900">The Global Cost of COVID vs. Lead</text>
      
      <g transform="translate(20, 72)">
        <text x="0" y="15" fill="#94a3b8" font-size="11">COVID-19 Global Disruption:</text>
        <text x="230" y="15" fill="#f87171" font-size="13" font-weight="900">$14T – $28 Trillion</text>
        <text x="0" y="32" fill="#64748b" font-size="10">Cutler &amp; Summers (JAMA) / IMF economic loss</text>

        <text x="0" y="56" fill="#94a3b8" font-size="11">Annual Global Lead Tax:</text>
        <text x="230" y="56" fill="#34d399" font-size="13" font-weight="900">$14.8 Trillion / Year</text>
        <text x="0" y="73" fill="#64748b" font-size="10">The Lancet Planetary Health (recalibrated 2026)</text>

        <rect x="0" y="86" width="440" height="52" rx="6" fill="#064e3b" opacity="0.4"/>
        <text x="12" y="104" fill="#a7f3d0" font-size="11" font-weight="800">The $100 Billion Prevention Dividend:</text>
        <text x="12" y="122" fill="#d1fae5" font-size="10.5">Had humanity spent $100B in universal lead remediation pre-2020,</text>
        <text x="12" y="136" fill="#d1fae5" font-size="10.5">>40% of fatal COVID ICU admissions &amp; $9.8T in loss would have been averted.</text>
      </g>
    </g>
  </g>

