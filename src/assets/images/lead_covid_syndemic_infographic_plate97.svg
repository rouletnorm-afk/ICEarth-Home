  <!-- Background Grid -->
  <rect width="1600" height="1000" fill="#090d16"/>
  <rect width="1600" height="1000" fill="url(#gridPattern)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1600" height="8" fill="url(#headerGrad)"/>

  <!-- ================= HEADER SECTION ================= -->
  <g transform="translate(60, 40)">
